<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Interventie</title>
    <link rel="icon" href="img/Artboard%201logo.svg" type="image/svg+xml">
    
    <!-- Style -->
    <link rel="stylesheet" href="css/style.css?v=20261026_8w7">
    <link rel="stylesheet" href="css/file-manager.css?v=20261026_8w7">
    <link rel="stylesheet" href="css/loader.css?v=20261026_8w7">
    
    <!-- Preload AR Core Libraries & Chunks Data -->
    <link rel="preload" href="js/vendor/aframe.min.js" as="script">
    <link rel="preload" href="js/vendor/xr.js?v=1" as="script">
    <link rel="preload" href="js/vendor/xrextras.js?v=1" as="script">
    <link rel="preload" href="verkeersborden/data/chunks8w.json?v=20261026_8w7" as="fetch" crossorigin="anonymous">

    <!-- AR Libraries (8th Wall XR Engine) -->
    <script src="js/vendor/aframe.min.js"></script>
    <script src="js/vendor/xr.js?v=1" data-preload-chunks="slam" crossorigin="anonymous"></script>
    <script src="js/vendor/xrextras.js?v=1"></script>
    <script src="js/gif-component.js?v=20261026_8w7"></script>

    <!-- File Manager -->
    <script src="js/file-manager.js?v=20261026_8w7"></script>
    
    <!-- Memeborden Module (verkeersborden AR + GIF) -->
    <script src="js/memeborden.js?v=20261026_8w7"></script>
    
    <!-- iPhone Mirror (capture QuickTime venster) -->
    <script src="js/iphone-mirror.js?v=20261026_8w7"></script>
    
    <!-- Presentatie Slideshow -->
    <script src="js/slideshow.js?v=20261026_8w7"></script>
    
    <!-- App Logic (8th Wall XR Multi-Chunk Engine) -->
    <script src="js/app.js?v=20261026_8w7"></script>
</head>
<body class="main-website">
    <!-- Hacker Loader -->
    <div id="hacker-loader" class="visible">
        <div id="loader-content">
            <div class="log-line">> SYSTEM_INIT...</div>
        </div>
        <div class="loader-status">
            <span>PROCESSING</span>
            <span class="blink-cursor"></span>
        </div>
    </div>

    <!-- Desktop / File Manager View -->
    <div id="desktop-view">
        <!-- Content will be generated by file-manager.js -->
    </div>

    <!-- AR View (Mobile) -->
    <div id="mobile-ar-view" style="display: none;">
        <!-- Logo Header -->
        <header id="ar-header">
            <img src="img/Artboard 1logo.svg" alt="Logo" class="logo">
        </header>

        <!-- Scanning Overlay -->
        <div id="scanning-overlay" class="scanning-overlay">
            <div class="scan-guide">
                <div class="scan-frame"></div>
                <p id="scanning-indicator">Richt je camera op een poster</p>
            </div>
        </div>

        <!-- 8th Wall AR Scene Container -->
        <div id="ar-scene"></div>
    </div>

    <!-- AR Footer / Swipe Bar - OUTSIDE #mobile-ar-view (z-index context fix) -->
    <div id="ar-footer-swipe-bar" class="ar-footer-swipe-bar">
        <div class="footer-header" onclick="window.toggleFooter && window.toggleFooter()">
            <div class="swipe-indicator"></div>
            
            <!-- State 1: Gallery Hint -->
            <div id="swipe-state-1" class="swipe-state active">
                <span class="swipe-text">ALLE POSTERS</span>
                <svg class="chevron-icon" width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            
            <!-- State 2: Detected Poster Info -->
            <div id="swipe-state-2" class="swipe-state">
                <span class="swipe-text" id="detected-poster-title">Titel</span>
                <svg class="chevron-icon" width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>
        
        <!-- Expanded Content (Gallery) -->
        <div id="gallery-content" class="gallery-content">
            <div id="gallery-overlay-grid" class="gallery-grid"></div>
        </div>
    </div>

    <!-- Gallery Overlay (Dynamic) -->
    <div id="gallery-overlay" class="gallery-overlay" style="display: none;"></div>

    <!-- POPUP WINDOWS CONTAINER - GUARANTEED TOP LEVEL (z-index 1000001, above footer) -->
    <div id="popup-windows-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000001;">
        <!-- All popup windows will be added here -->
    </div>

    <!-- Download Modal - Dossier Style -->
    <div id="download-modal" class="modal">
        <div class="modal-content">
            <span class="close">[X] SLUITEN</span>
            <div class="modal-body">
                <div class="modal-image-container">
                    <img id="modal-poster-img" src="" alt="Poster">
                </div>
                <div class="modal-info" id="poster-info">
                    <h2 id="modal-poster-title"></h2>
                    <p id="modal-poster-description" class="modal-description"></p>
                    <p id="modal-poster-location" class="modal-location"></p>
                    <p id="modal-poster-article" class="modal-article"></p>
                    <p id="modal-poster-photographer" class="modal-photographer"></p>
                    
                    <div class="download-section">
                        <h3>> DOWNLOAD_</h3>
                        <div class="download-buttons">
                            <button class="download-btn" data-format="jpeg" data-size="original">↓ DOWNLOAD JPEG</button>
                            <button class="download-btn" data-format="pdf" data-size="a3">↓ DOWNLOAD A3 PDF</button>
                            <button class="download-btn" data-format="pdf" data-size="a0">↓ DOWNLOAD A0 PDF</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/remove-download-metrics.js?v=1"></script>
    <script src="/stats.js?v=4"></script>
</body>
</html>
