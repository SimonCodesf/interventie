name: Deploy Krant 8th Wall

on:
  push:
    branches:
      - main
    paths:
      - 'krant-8thwall/**'
      - '.github/workflows/deploy-krant-8thwall.yml'
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy krant-8thwall naar /krant-8thwall
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v3

      - name: Sync krant-8thwall to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: krant-8thwall/
          server-dir: ./krant-8thwall/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            data/essays.db
            data/login_attempts.json
            tools/package-lock.json
            .DS_Store
            **/.DS_Store
            docs/**
