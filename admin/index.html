<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="admin-container">
        <header>
            <h1>ADMIN</h1>
            <div>
                <button id="logout-btn" class="back-link">LOGOUT</button>
                <a href="../index.html" class="back-link">TERUG</a>
            </div>
        </header>

        <main class="admin-main">
            <!-- Login -->
            <div id="login-section" class="login-section">
                <h2>Inloggen</h2>
                <form id="login-form">
                    <input type="password" id="admin-password" placeholder="Wachtwoord" required>
                    <button type="submit">Login</button>
                </form>
                <p class="error-message" id="login-error"></p>
            </div>

            <!-- Upload -->
            <div id="upload-section" class="upload-section" style="display: none;">
                <div class="upload-card">
                    <h2>Nieuwe Poster</h2>
                    <form id="upload-form">
                        <div class="form-group">
                            <label>Titel</label>
                            <input type="text" name="title" required>
                        </div>
                        <div class="form-group">
                            <label>Beschrijving</label>
                            <textarea name="description"></textarea>
                        </div>
                        
                        <h3>Bestanden</h3>
                        <div class="form-group">
                            <label>JPEG (Website)</label>
                            <input type="file" name="jpeg" accept="image/jpeg" required>
                        </div>
                        <div class="form-group">
                            <label>PDF (A3)</label>
                            <input type="file" name="pdfMedium" accept="application/pdf" required>
                        </div>
                        <div class="form-group">
                            <label>PDF (A0)</label>
                            <input type="file" name="pdfLarge" accept="application/pdf" required>
                        </div>
                        
                        <h3>AR Marker</h3>
                        <div class="form-group">
                            <label>HQ Marker (.mind)</label>
                            <input type="file" name="ar_marker_file_hq" accept=".mind" required>
                        </div>
                        <div class="form-group">
                            <label>LQ Marker (.mind) (Optioneel)</label>
                            <input type="file" name="ar_marker_file_lq" accept=".mind">
                        </div>
                        
                        <h3>AR Lagen</h3>
                        <div id="layers-container"></div>
                        
                        <button type="submit" id="upload-btn" class="upload-btn">Upload Poster</button>
                    </form>
                </div>

                <div class="posters-management">
                    <h2>Bestaande Posters</h2>
                    <div id="admin-poster-list"></div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
