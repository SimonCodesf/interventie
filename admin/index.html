<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard // INTERVENTIE</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link rel="stylesheet" href="css/admin-terminal.css">
</head>
<body>
    <!-- Login Section -->
    <div id="login-section" style="display: flex; justify-content: center; align-items: center; height: 100vh; width: 100%; background: #000000;">
        <div style="width: 400px; border: 0.5px solid #ffffff; background: #000000; box-shadow: 8px 8px 0px rgba(255, 255, 255, 0.2);">
            <div style="background: #ffffff; color: #000000; padding: 0.25rem 0.5rem; font-family: 'Roboto Mono', monospace; font-size: 0.8rem; font-weight: bold; display: flex; justify-content: space-between; text-transform: uppercase;">
                <span>AUTHENTICATION REQUIRED</span>
                <span>[SECURE]</span>
            </div>
            <div style="padding: 1.5rem;">
                <form id="login-form">
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; color: #ffffff; font-family: 'Roboto Mono', monospace; font-size: 0.9rem;">ACCESS CODE</label>
                        <input type="password" id="admin-password" style="width: 100%; background: #000000; border: 0.5px solid rgba(255,255,255,0.5); color: #ffffff; padding: 0.75rem; font-family: 'Roboto Mono', monospace; box-sizing: border-box;" required autofocus>
                    </div>
                    <button type="submit" style="width: 100%; background: #ffffff; color: #000000; border: none; padding: 0.75rem; font-family: 'Roboto Mono', monospace; font-size: 0.9rem; cursor: pointer; text-transform: uppercase; font-weight: bold;">LOGIN</button>
                </form>
                <p id="login-error" style="color: #ff5555; text-align: center; margin-top: 1rem; font-family: 'Roboto Mono', monospace; font-size: 0.8rem;"></p>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="upload-section" style="display: none; flex-direction: row; width: 100%; height: 100vh;">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h1 style="font-family: 'Bebas Neue', Impact, sans-serif; font-size: 1.5rem; letter-spacing: 1px; margin: 0;">INTERVENTIE</h1>
                <div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-top: 0.2rem;">ADMINISTRATION CONSOLE v2.0</div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="../index.html" style="background: transparent; border: 0.5px solid transparent; color: rgba(255,255,255,0.5); padding: 0.5rem; text-align: left; font-family: 'Roboto Mono', monospace; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; text-decoration: none; display: block;">
                    <span style="margin-right: 0.5rem;">&lt;</span> RETURN TO SITE
                </a>
                <button id="logout-btn" style="background: transparent; border: 0.5px solid transparent; color: rgba(255,255,255,0.5); padding: 0.5rem; text-align: left; font-family: 'Roboto Mono', monospace; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; text-decoration: none; display: block; width: 100%;">
                    <span style="margin-right: 0.5rem;">x</span> TERMINATE SESSION
                </button>
            </nav>

            <div style="margin-top: 2rem; border-top: 0.5px solid #ffffff; padding-top: 1rem;">
                <div style="font-family: 'Roboto Mono', monospace; font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-bottom: 0.5rem; text-transform: uppercase;">DATABASE RECORDS</div>
                <div id="admin-poster-list" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
            </div>
        </aside>

        <!-- Main Content -->
        <main style="flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative;">
            <div style="border: 0.5px solid #ffffff; display: flex; flex-direction: column; background: #000000; box-shadow: 4px 4px 0px rgba(255, 255, 255, 0.2); margin: 1rem; min-height: 0; flex: 1;">
                <div style="background: #ffffff; color: #000000; padding: 0.25rem 0.5rem; font-family: 'Roboto Mono', monospace; font-size: 0.8rem; font-weight: bold; display: flex; justify-content: space-between; text-transform: uppercase;">
                    <span>UPLOAD_PROTOCOL.EXE</span>
                    <span>STATUS: READY</span>
                </div>
                <div style="flex: 1; overflow-y: scroll; overflow-x: hidden; padding: 1.5rem; display: block; min-height: 0; position: relative;">
                    <form id="upload-form">
                        <!-- Section: Metadata -->
                        <div style="border-bottom: 0.5px solid rgba(255,255,255,0.5); padding-bottom: 1.5rem; margin-bottom: 2rem; width: 100%;">
                            <h2 style="font-size: 0.95rem; margin: 0 0 1rem 0; color: #ffffff; font-family: 'Roboto Mono', monospace; text-transform: uppercase; letter-spacing: 1px;">// META_DATA</h2>
                            
                            <div style="margin-bottom: 1rem;">
                                <label style="display: block; margin-bottom: 0.5rem; color: #ffffff; font-family: 'Roboto Mono', monospace;">TITLE_ID</label>
                                <input type="text" id="upload-title" name="title" style="width: 100%; background: #000000; border: 0.5px solid rgba(255,255,255,0.5); color: #ffffff; padding: 0.75rem; font-family: 'Roboto Mono', monospace; box-sizing: border-box;" required>
                            </div>
                            
                            <div style="margin-bottom: 1rem;">
                                <label style="display: block; margin-bottom: 0.5rem; color: #ffffff; font-family: 'Roboto Mono', monospace;">DESCRIPTION_TEXT</label>
                                <textarea id="upload-description" name="description" style="width: 100%; background: #000000; border: 0.5px solid rgba(255,255,255,0.5); color: #ffffff; padding: 0.75rem; font-family: 'Roboto Mono', monospace; box-sizing: border-box; min-height: 100px;" rows="3"></textarea>
                            </div>

                            <div style="margin-bottom: 1rem;">
                                <label style="display: block; margin-bottom: 0.5rem; color: #ffffff; font-family: 'Roboto Mono', monospace;">SOURCE_FILE (JPG/PNG)</label>
                                <input type="file" id="upload-file" name="image" accept="image/jpeg,image/png" style="width: 100%; background: #000000; border: 0.5px solid rgba(255,255,255,0.5); color: #ffffff; padding: 0.75rem; font-family: 'Roboto Mono', monospace; box-sizing: border-box;" required>
                                <div id="upload-success" style="display: none; color: #00ff00; font-family: 'Roboto Mono', monospace; font-size: 0.85rem; margin-top: 0.5rem;"></div>
                            </div>
                        </div>

                        <!-- Section: AR Layers -->
                        <div style="border-bottom: 0.5px solid rgba(255,255,255,0.5); padding-bottom: 1.5rem; margin-bottom: 2rem; width: 100%;">
                            <h2 style="font-size: 0.95rem; margin: 0 0 1rem 0; color: #ffffff; font-family: 'Roboto Mono', monospace; text-transform: uppercase; letter-spacing: 1px;">// AR_LAYERS</h2>
                            <div id="layers-container" style="display: flex; flex-direction: column;"></div>
                        </div>

                        <!-- Submit Button -->
                        <div style="padding-top: 1rem; border-top: 0.5px solid #ffffff;">
                            <button type="submit" style="width: 100%; background: #ffffff; color: #000000; border: none; padding: 0.75rem; font-family: 'Roboto Mono', monospace; font-size: 0.9rem; cursor: pointer; text-transform: uppercase; font-weight: bold;">INITIATE_UPLOAD</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
