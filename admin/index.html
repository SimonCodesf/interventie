<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard // INTERVENTIE</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link rel="stylesheet" href="css/admin-terminal.css">
</head>
<body>

    <!-- Login Screen -->
    <div id="login-section" class="login-container">
        <div class="login-box">
            <div class="window-header">
                <span>AUTHENTICATION REQUIRED</span>
                <span>[SECURE]</span>
            </div>
            <div class="window-content">
                <form id="login-form">
                    <div class="form-group">
                        <label>ACCESS CODE</label>
                        <input type="password" id="admin-password" class="form-control" required autofocus>
                    </div>
                    <button type="submit" class="btn-terminal primary" style="width: 100%;">LOGIN</button>
                </form>
                <p id="login-error" style="color: #ff5555; text-align: center; margin-top: 1rem; font-family: var(--font-data); font-size: 0.8rem;"></p>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="upload-section" class="admin-wrapper" style="display: none;">
        
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h1>INTERVENTIE</h1>
                <div style="font-size: 0.7rem; color: var(--dim); margin-top: 0.2rem;">ADMINISTRATION CONSOLE v2.0</div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="../index.html" class="nav-item">
                    <span style="margin-right: 0.5rem;">&lt;</span> RETURN TO SITE
                </a>
                <button id="logout-btn" class="nav-item">
                    <span style="margin-right: 0.5rem;">x</span> TERMINATE SESSION
                </button>
            </nav>

            <div class="poster-list-container">
                <div class="poster-list-title">DATABASE RECORDS</div>
                <div id="admin-poster-list">
                    <!-- Poster items injected here -->
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <div class="terminal-window">
                <div class="window-header">
                    <span>UPLOAD_PROTOCOL.EXE</span>
                    <span>STATUS: READY</span>
                </div>
                <div class="window-content">
                    <form id="upload-form">
                        <!-- Metadata Section -->
                        <div class="form-section">
                            <h2>// META_DATA</h2>
                            
                            <div class="form-group">
                                <label for="poster-title">TITLE_ID</label>
                                <input type="text" id="poster-title" class="form-control" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="poster-description">DESCRIPTION_TEXT</label>
                                <textarea id="poster-description" class="form-control" rows="3"></textarea>
                            </div>

                            <div class="form-group">
                                <label for="poster-file">SOURCE_FILE (JPG/PNG)</label>
                                <input type="file" id="poster-file" class="form-control" accept="image/jpeg,image/png" required>
                                <div id="file-size-info" class="file-size-info"></div>
                            </div>
                        </div>

                        <!-- AR Layers Section -->
                        <div class="form-section">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                                <h2>// AR_LAYERS</h2>
                                <button type="button" id="add-layer-btn" class="btn-terminal" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">+ ADD_LAYER</button>
                            </div>
                            
                            <div id="layers-container">
                                <!-- Layers injected here -->
                            </div>
                        </div>

                        <!-- Submit -->
                        <div style="padding-top: 1rem; border-top: 0.5px solid var(--white);">
                            <button type="submit" id="upload-btn" class="btn-terminal primary" style="width: 100%;">INITIATE_UPLOAD</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Layer Template (Hidden) -->
    <template id="layer-template">
        <details class="layer-accordion" open>
            <summary>
                <span>LAYER_<span class="layer-index">0</span></span>
                <button type="button" class="remove-layer-btn" style="background: none; border: none; color: #ff5555; cursor: pointer; font-family: var(--font-data);">[DELETE]</button>
            </summary>
            <div class="layer-content">
                <div class="form-group">
                    <label>LAYER_TYPE</label>
                    <select class="layer-type form-control">
                        <option value="image">IMAGE_OVERLAY</option>
                        <option value="video">VIDEO_PLAYBACK</option>
                        <option value="audio">AUDIO_STREAM</option>
                        <option value="text">TEXT_BLOCK</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>SOURCE_FILE</label>
                    <input type="file" class="layer-file form-control">
                </div>

                <!-- Transform Controls -->
                <div style="background: rgba(255,255,255,0.05); padding: 1rem; border: 0.5px solid var(--dim); margin-top: 1rem;">
                    <h5 style="margin: 0 0 0.5rem 0; font-size: 0.8rem; color: var(--dim);">TRANSFORM_MATRIX</h5>
                    
                    <div style="display: flex; gap: 1rem; margin-bottom: 0.5rem;">
                        <div style="flex: 1;">
                            <label style="font-size: 0.7rem; color: var(--dim);">POS_X</label>
                            <input type="number" class="layer-pos-x form-control" value="0" step="0.1" style="padding: 0.4rem;">
                        </div>
                        <div style="flex: 1;">
                            <label style="font-size: 0.7rem; color: var(--dim);">POS_Y</label>
                            <input type="number" class="layer-pos-y form-control" value="0" step="0.1" style="padding: 0.4rem;">
                        </div>
                        <div style="flex: 1;">
                            <label style="font-size: 0.7rem; color: var(--dim);">POS_Z</label>
                            <input type="number" class="layer-pos-z form-control" value="0" step="0.1" style="padding: 0.4rem;">
                        </div>
                    </div>

                    <div style="display: flex; gap: 1rem;">
                        <div style="flex: 1;">
                            <label style="font-size: 0.7rem; color: var(--dim);">SCALE</label>
                            <input type="number" class="layer-scale form-control" value="1" step="0.1" style="padding: 0.4rem;">
                        </div>
                        <div style="flex: 1;">
                            <label style="font-size: 0.7rem; color: var(--dim);">ROTATION</label>
                            <input type="number" class="layer-rot form-control" value="0" step="90" style="padding: 0.4rem;">
                        </div>
                    </div>
                </div>
            </div>
        </details>
    </template>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center;">
        <div class="terminal-window" style="width: 90%; max-width: 800px; height: 80vh; margin: 0;">
            <div class="window-header">
                <span>EDIT_MODE</span>
                <span class="close-modal" style="cursor: pointer;">[CLOSE]</span>
            </div>
            <div class="window-content" id="edit-modal-body">
                <!-- Edit form injected here -->
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
