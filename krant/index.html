<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <title>Interventie</title>
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

    <div id="ar-view">

        <header id="masthead">
            <h1>INTERVENTIE</h1>
        </header>

        <div id="scanning-overlay">
            <div class="scan-guide">
                <div class="scan-frame"></div>
                <p id="scan-text">Richt je camera op de krantenpagina</p>
            </div>
        </div>

        <div id="ar-scene"></div>
        <div id="ar-status"></div>

        <button id="toggle-prev" style="display:none;">SCAN VORIGE ESSAYS</button>

        <div id="start-overlay">
            <button id="start-btn">START CAMERA</button>
            <p>Tik om de camera te starten en de pagina te scannen</p>
        </div>

    </div>

    <script src="js/app.js?v=2"></script>
</body>
</html>
