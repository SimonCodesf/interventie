<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AR Test</title>
<style>
    html, body { margin: 0; height: 100%; background: #f2eee2; font-family: Helvetica, Arial, sans-serif; }
    #hint {
        position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
        background: rgba(20,20,20,.9); color: #fff; padding: 6px 14px;
        font-size: 12px; z-index: 10; text-align: center; max-width: 90%;
    }
    #poster {
        position: fixed; bottom: 10px; right: 10px; width: 170px;
        z-index: 10; border: 1px solid #141414;
    }
</style>
</head>
<body>
<div id="hint">Open deze pagina ook op je computer → scan met je telefoon het beeld rechtsonder op dat scherm</div>
<img id="poster" src="../img/AR_test_01.png" alt="testmarker">
<div style="position:fixed;inset:0">
    <a-scene mindar-image="imageTargetSrc: ../assets/all-posters.mind; warmupTolerance: 0; missTolerance: 2; uiLoading: no; uiScanning: no; uiError: no;" color-space="sRGB" renderer="colorManagement: true; antialias: false" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0">
            <a-plane position="0 0 0.01" width="1" height="1.414" color="#ff7f00" opacity="0.6" material="transparent: true"></a-plane>
        </a-entity>
    </a-scene>
</div>
<script src="js/vendor/aframe.min.js"></script>
<script src="js/vendor/mindar-image-aframe.prod.js"></script>
<script>
    var scene = document.querySelector('a-scene');
    var hint = document.getElementById('hint');
    var t = document.querySelector('[mindar-image-target]');
    scene.addEventListener('arReady', function () { console.log('[TEST] arReady'); });
    scene.addEventListener('arError', function () { hint.textContent = 'CAMERA FOUT'; });
    t.addEventListener('targetFound', function () {
        console.log('[TEST] target GEVONDEN');
        hint.textContent = 'GEVONDEN — de runtime werkt; het probleem zit in jouw marker/print';
    });
    t.addEventListener('targetLost', function () {
        console.log('[TEST] target verloren');
        hint.textContent = 'Verloren… blijf richten';
    });
    scene.addEventListener('loaded', function () {
        if (scene.renderer && scene.renderer.setPixelRatio) scene.renderer.setPixelRatio(1);
    });
</script>
</body>
</html>
